    minimum_monthly_fee:           { skill: 250.0, currier_executed: 250.0,  verdict: CORRECT_FOR_CURRIER }
    repair_cap:                    { skill: 500.0, currier_executed: 500.0,  verdict: CORRECT_FOR_CURRIER }
    refund_notice_threshold:       { skill: 200.0, currier_executed: 200.0,  verdict: CORRECT_FOR_CURRIER }
    pet_fee_to_owner:              { skill: 200.0, currier_executed: "in full", verdict: CORRECT_FOR_CURRIER }
    deduct_ota_fees:               { skill: false, currier_executed: false,  verdict: CORRECT_FOR_CURRIER,
                                     note: "Confirmed by Will 2026-09-15 — guest bears it via platform markup." }
    early_late_fee_owner_share_pct: { skill: 50,   currier_executed: 0,
                                      verdict: WRONG,
                                      note: "Exhibit A: early check-in / late check-out fees are
                                             not charged to guests at all when accommodated.
                                             The skill invented a 50/50 split of a fee that
                                             does not exist. This is the one genuine error." }
  exhibit_a: "REAL. Part of the executed contract. The skill's citation was accurate."
  owner_confirmation: "REAL. Rand Currier's eSignature, 2026-08-26 22:38:31 UTC."
