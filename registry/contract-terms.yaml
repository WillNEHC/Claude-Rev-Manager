# ---------------------------------------------------------------------------
# What the old skill asserted, kept ONLY as an audit trail of what to verify.
# Do not treat any line here as authoritative.
# ---------------------------------------------------------------------------
prior_skill_assertions_to_verify:
  note: >
    These were hardcoded in nehc-owner-report and applied to ALL properties. Given that terms
    are customizable per owner, some may be correct for SOME properties — but they were being
    applied universally, which is the actual defect.
  claims:
    management_fee_pct: 20.0            # vs template 25%
    minimum_monthly_fee: 250.00         # not in the template at all
    deduct_ota_fees: false              # vs template "deduct" — cited "Exhibit A", not located
    pet_fee_to_owner: 200.00            # vs template "retained by NEHC"
    early_late_fee_owner_share_pct: 50  # vs template "retained by NEHC"
    provenance: "Skill said 'Confirmed by owner Aug 2026'. No such confirmation found in
                 Drive, Gmail or Slack. Which owner, and which property, is UNKNOWN."
