# NEHC Contract Terms Registry
#
# WHY THIS FILE EXISTS: the fee percentage used to live inside a prompt. That is how the
# owner-report tool ended up on 20% while the agreement template says 25%. Fee terms are
# DATA, not prose. Tools read them from here. Nothing computes money from a prompt.
#
# Will confirmed 2026-09-15: "our contract is customizable for some owners."
# So the template is the DEFAULT, and each property may legitimately override it.
# An override is only valid once it is traced to an EXECUTED agreement.
#
# HARD RULE: if a property's terms are `source: UNVERIFIED`, tools MUST NOT generate an
# owner statement for it. Stop and ask Will. Never fall back to the default silently.

version: 1
updated: 2026-09-15

# ---------------------------------------------------------------------------
# DEFAULT — verbatim from "NEHC - STR Management Agreement"
# (1R1bFFDmw4CSRswBMPs5oiA9W1QOmcTT2P6Ry9-qxylw). NOTE: that Drive copy is an
# UNEXECUTED TEMPLATE (blank signature blocks, [address], [list all legal owners]).
# ---------------------------------------------------------------------------
default_terms:
  source: "Management Agreement template, Drive 1R1bFFDmw4CSRswBMPs5oiA9W1QOmcTT2P6Ry9-qxylw"
  source_status: TEMPLATE_UNEXECUTED

  management_fee_pct: 25.0                       # Part I §C.1
  minimum_monthly_fee: null                      # NOT present in the template
  technology_fee_monthly: 30.00                  # Part I §A.10

  rental_proceeds:
    basis: rent_only                             # Part II §C.3 — excludes taxes, cleaning, guest fees
    channel_bookings_deduct_ota_fees: true       # Part II §C.2 — "less fees, charges, or commissions
                                                 # imposed by the Channel"; §C.4 lists them as deducted
                                                 # BEFORE Rental Proceeds are calculated
    ota_host_fee_reference:                      # §C.4, "approximate", set by the OTA, not by NEHC
      airbnb_pct: 3
      vrbo_pct: 5
      bookingcom_pct: 15

  guest_fees_retained_by_nehc: true              # Part II §B.1 — booking fee, PET FEE, hot tub fee,
                                                 # late check-out fee, concierge etc. are NOT Rental
                                                 # Proceeds and are NOT shared with Owner
  pet_fee_to_owner: false
  early_late_fee_owner_share_pct: 0

  statement_basis: checkout_month                # Part I §C.2
  payment_due_day: 10                            # by the 10th, next business day if weekend/holiday

  repair_cap_without_owner_auth: 800.00          # Part I §A.7
  emergency_repair_notify_threshold: 1500.00     # Part II §B.6 — notify within 24h
  operational_flag_threshold: 500.00             # NOT contractual. Internal early-warning only.
  refund_flag_threshold: 200.00                  # NOT contractual. Internal early-warning only.

  deep_cleans_per_year_min: 2                    # Part II §B.7, charged to Owner at market rate
  post_termination_commission_pct: 10            # Part I §E.3
  termination_notice_days: 90                    # Part I §E.2
  owner_liability_insurance_min: 1000000         # Part I §B.5, Kembo Homes named additional insured

# ---------------------------------------------------------------------------
# PER-PROPERTY TERMS
# Populate ONLY from an executed agreement. Until then: UNVERIFIED → statements blocked.
# ---------------------------------------------------------------------------
properties:

  NEHC-P-FLAGSTONE:
    source: UNVERIFIED
    executed_agreement_file: UNKNOWN
    overrides: {}
    blocked_reason: >
      UNKNOWN — REQUIRES HUMAN INPUT. No executed agreement located. Will confirmed terms are
      customizable per owner, so the 25% default cannot be assumed for this property.
      Needed: management_fee_pct, whether OTA fees are deducted, pet/early/late fee treatment,
      any minimum monthly fee, and any Exhibit A.

  NEHC-P-AMORY:
    source: UNVERIFIED
    executed_agreement_file: UNKNOWN
    overrides: {}
    blocked_reason: "UNKNOWN — REQUIRES HUMAN INPUT. Same as Flagstone."

  NEHC-P-LUDLOW:
    source: UNVERIFIED
    executed_agreement_file: UNKNOWN
    overrides: {}
    blocked_reason: "UNKNOWN — REQUIRES HUMAN INPUT. Same as Flagstone."

  NEHC-P-LAKESHORE:
    source: EXECUTED                  # ✅ VERIFIED 2026-09-15 from the signed PDF
    executed_agreement_file: 1YK4cfXqS90Cqk_9PzeDUXP4-CR56LiN9   # 230LakeshoreDr-CurrierFinal.pdf
    executed_date: 2026-08-26
    signatories:
      owner: "Rand Currier <randcurrier@gmail.com>, 160 Lakeshore Drive, Franklin NH 03235, 703-587-8960"
      nehc: "Will Robichaud — Partner/Operator"
    audit_trail: "Google eSignature. Sent 2026-08-26 15:27 UTC; owner signed 22:38:31 UTC;
                  Will signed 22:41:17 UTC; COMPLETED 22:41:17 UTC."
    overrides:
      management_fee_pct: 20.0                      # §C.1 — NOT the 25% template rate
      minimum_monthly_fee: 250.00                   # §A.12
      repair_cap_without_owner_auth: 500.00         # §A.7 — NOT the $800 template cap.
                                                    # Notify Owner by phone/text BEFORE authorising
                                                    # any repair expected to exceed $500, except a
                                                    # genuine life-safety emergency.
      refund_notice_threshold: 200.00               # §B.3 — notify Owner BEFORE issuing any refund >$200
      pet_fee_to_owner: true                        # Exhibit A — $200/stay passed to Owner IN FULL,
                                                    # shown as its own line on the statement
      early_late_fees_charged: false                # Exhibit A — "Early Check-In and Late Check-Out
                                                    # fees will not apply to guests if accommodated"
      post_termination_commission_pct: 0            # the 10% provision was removed in negotiation
                                                    # (Will to Rand, 2026-06-30: "I removed the 10%
                                                    # provision entirely")
      owner_trust_account_initial: 250.00           # §A.10
      owner_trust_account_minimum: 250.00           # §A.11 — auto-debit to replenish
      owner_may_set_peak_rate_floor: true           # §A.3 — Owner may set a minimum nightly rate
                                                    # floor for designated peak periods, in writing
      photography_billed: at_cost                   # §A.14.a — NOT the $575 template figure
      nehc_bears_own_error_refunds: true            # §B.3 / A.8.15 — refunds caused by NEHC error
                                                    # do NOT reduce Owner Payment
      assignment_requires_owner_consent: true       # §G.3
      fee_increases_require_owner_consent: true     # §G.8.b — silence is NOT acceptance
    ota_host_fee_schedule:                          # Exhibit A + §C.4 — differs from the template
      airbnb_pct: 15.5
      vrbo_pct: 8
      bookingcom_pct: 15
      direct_pct: 4
    OPEN_AMBIGUITY_IN_EXECUTED_DOCUMENT: >
      SOURCE CONFLICT — HUMAN REVIEW REQUIRED, and it is INSIDE the signed contract, not between
      documents. Part II §C.2 says Rental Proceeds for Channel bookings are the nightly rate
      "less fees, charges, or commissions imposed by the Channel", and §C.4 says the OTA host-side
      fees are "deducted from booking revenue before Rental Proceeds are calculated".
      Exhibit A instead presents those same percentages as a Booking Fee "Charged To: Guest",
      a "pass-through of OTA commission... Retained by NEHC; no markup".
      Both cannot operate at once without either double-counting the OTA cost or leaving it
      uncharged. Reading A (Exhibit A governs): the guest pays it, rent reaches the Owner whole.
      Reading B (§C.2/C.4 govern): it is deducted from rent before the Owner is paid.
      On Airbnb at 15.5% this is the difference between an Owner receiving 100% and ~84.5% of rent.
      DO NOT resolve this without Will and, given it is an executed contract, likely counsel.

