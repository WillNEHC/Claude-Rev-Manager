  NEHC-P-LUDLOW:
    source: UNVERIFIED
    executed_agreement_file: UNKNOWN
    overrides: {}
    blocked_reason: "UNKNOWN — REQUIRES HUMAN INPUT. Same as Flagstone."

  NEHC-P-LAKESHORE:
    source: EXECUTED                  # ✅ VERIFIED 2026-09-15 from the signed PDF
    executed_agreement_file: 1YK4cfXqS90Cqk_9PzeDUXP4-CR56LiN9   # 230LakeshoreDr-CurrierFinal.pdf
    executed_date: 2026-08-26
    signatories:
      owner: "Rand Currier <randcurrier@gmail.com>, 160 Lakeshore Drive, Franklin NH 03235, 703-587-8960"
      nehc: "Will Robichaud — Partner/Operator"
    audit_trail: "Google eSignature. Sent 2026-08-26 15:27 UTC; owner signed 22:38:31 UTC;
                  Will signed 22:41:17 UTC; COMPLETED 22:41:17 UTC."
    overrides:
      management_fee_pct: 20.0                      # §C.1 — NOT the 25% template rate
      minimum_monthly_fee: 250.00                   # §A.12
      repair_cap_without_owner_auth: 500.00         # §A.7 — NOT the $800 template cap.
                                                    # Notify Owner by phone/text BEFORE authorising
                                                    # any repair expected to exceed $500, except a
                                                    # genuine life-safety emergency.
      refund_notice_threshold: 200.00               # §B.3 — notify Owner BEFORE issuing any refund >$200
      pet_fee_to_owner: true                        # Exhibit A — $200/stay passed to Owner IN FULL,
                                                    # shown as its own line on the statement
      early_late_fees_charged: false                # Exhibit A — "Early Check-In and Late Check-Out
                                                    # fees will not apply to guests if accommodated"
      post_termination_commission_pct: 0            # the 10% provision was removed in negotiation
                                                    # (Will to Rand, 2026-06-30: "I removed the 10%
                                                    # provision entirely")
      owner_trust_account_initial: 250.00           # §A.10
      owner_trust_account_minimum: 250.00           # §A.11 — auto-debit to replenish
      owner_may_set_peak_rate_floor: true           # §A.3 — Owner may set a minimum nightly rate
                                                    # floor for designated peak periods, in writing
      photography_billed: at_cost                   # §A.14.a — NOT the $575 template figure
      nehc_bears_own_error_refunds: true            # §B.3 / A.8.15 — refunds caused by NEHC error
                                                    # do NOT reduce Owner Payment
      assignment_requires_owner_consent: true       # §G.3
      fee_increases_require_owner_consent: true     # §G.8.b — silence is NOT acceptance
    ota_host_fee_schedule:                          # Exhibit A + §C.4 — differs from the template
      airbnb_pct: 15.5
      vrbo_pct: 8
      bookingcom_pct: 15
      direct_pct: 4
    OTA_FEE_TREATMENT:
      decided_by: "Will, 2026-09-15"
      decision: >
        RESOLVED. The guest bears the OTA cost because NEHC raises the listed price on each
        platform to absorb it. Exhibit A governs: the booking fee is charged to the guest as a
        pass-through of actual platform cost, retained by NEHC with no markup. The owner receives
        the intended base rent whole. Part II C.2/C.4 describe the same economics from the
        platform's side (the OTA takes its cut off the gross before NEHC nets out) — they are not
        a second, additional deduction from the owner.
      markup_by_channel:                 # the uplift applied to the listed price to cover the fee
        airbnb_pct: 15.5
        vrbo_pct: 8
        bookingcom_pct: 15
        direct_pct: 4
      OPEN_DATA_QUESTION_BEFORE_FIRST_STATEMENT: >
        🔴 MUST BE SETTLED BEFORE ANY STATEMENT IS GENERATED. Will's mechanism is clear, but it
        makes the statement arithmetic depend entirely on ONE unverified fact: whether PriceLabs
        `rental_revenue` is the GROSS marked-up rate (fee included) or the NET amount NEHC actually
        receives (fee already removed).
          - If `rental_revenue` is GROSS, paying the owner that figure OVERPAYS by the markup
            (15.5% on Airbnb), because the markup is the platform's fee, not the owner's rent.
          - If `rental_revenue` is NET, deducting anything further UNDERPAYS by the same amount.
        The error is the same size in either direction and it is large.
        HOW TO SETTLE IT CHEAPLY: take one completed Airbnb reservation, compare the actual
        Hospitable/Airbnb host payout against the PriceLabs `rental_revenue` for that same
        reservation ID. If they match, the figure is NET. If PriceLabs is ~15.5% higher, it is GROSS.
        One reservation answers it permanently.
        Note: PriceLabs documents `ota_commission` and `rental_revenue_minus_ota_commission` as
        separate fields but returned neither in our queries — they appear unpopulated for this
        account, which is itself a signal worth checking.
      note: >
        This decision records the ECONOMIC intent for 230 Lakeshore. It does not license applying
        the same treatment to Flagstone, Amory or Ludlow, whose agreements remain unlocated.

